name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run after the usual NFL game windows (UTC; allow games and uploads to finish).
    - cron: '17 5 * * 5'  # Thursday night
    - cron: '17 22 * * 0' # Sunday early
    - cron: '17 1 * * 1'  # Sunday late afternoon
    - cron: '17 5 * * 1'  # Sunday night
    - cron: '17 5 * * 2'  # Monday night

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Verify and compile styles
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run build:css
          for script in js/*.js sw.js; do node --check "$script"; done
          python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Prepare public site
        run: |
          mkdir -p _site/css
          cp *.html sw.js manifest.webmanifest favicon.svg ads.txt robots.txt sitemap.xml CNAME _site/
          cp css/style.css css/utilities.css _site/css/
          cp -R js icons data _site/
      - name: Build matchup pages and sitemap
        run: python3 tools/build_game_pages.py --out _site
      - name: Verify generated matchup assets
        run: python3 tools/verify_game_pages.py --out _site
      - name: Refresh official game highlight links
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/refresh_highlights.py --out _site/data/highlights.json --previous-url https://highlightcorner.com/data/highlights.json --optional
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp build id into service worker
        # Fresh cache name per deploy -> the new worker installs on next visit
        # and no stale app shell can survive a release.
        run: sed -i "s/__BUILD_ID__/${{ github.sha }}/" _site/sw.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
